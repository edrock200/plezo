name: Silo preview APK
run-name: Silo preview APK ${{ github.sha }}

# Builds release APKs of a Silo-support branch and publishes them as a GitHub
# pre-release. Runs only for pushes whose head commit's first line contains
# "[release-apk]", so ordinary pushes stay cheap.
#
# Release notes come from the "## Next preview" section of
# docs/silo-preview-changelog.md (see silo-release-notes.yml).
#
# Signing: uses the ANDROID_* secrets when the repository has them (same names
# as build.yml). Otherwise a keystore is generated once and kept in the Actions
# cache, so later previews keep the same signature and install as updates
# while the cache lives (caches are branch-scoped and evicted after 7 days
# unused; add the secrets for a stable key). With a PREVIEW_KEYSTORE_PASSPHRASE
# secret the cached keystore and its password are encrypted with it
# (openssl aes-256-cbc, pbkdf2); a plaintext key cached before the secret
# existed is still used and moved to the encrypted cache entry. The app is
# Plezilo (package com.edrock200.plezilo), so it installs beside Plezy and
# beside the older "Plezy with Silo" previews (com.edde746.plezy) instead of
# replacing them.
#
# The cached keystore is restored and saved only by push runs of this
# workflow (never pull_request). Without PREVIEW_KEYSTORE_PASSPHRASE it is
# cached unencrypted, and any workflow run whose cache scope reaches this
# branch could read it; the run summary says so loudly. Once the passphrase
# exists, the plaintext entry of this branch is deleted after its key has been
# saved encrypted. Each build also compares its APK's signing certificate with
# the previous preview's and puts an "uninstall first" warning at the top of
# the release notes when it changed (scripts/silo_apk_signer.py).
#
# Versions: each preview adds 0.1, <major>.<minor + 1>.0 of the highest existing
# silo-preview-* tag (2.26.6 -> 2.27.0); the build number is above every earlier
# preview's (scripts/silo_preview_version.sh). Each release records its build
# in the silo-preview-build.txt asset.
#
# The Flutter SDK is the one upstream's build.yml pins
# (scripts/silo_flutter_version.sh). SUPPORTER_MODE is left unset (perks off),
# like upstream's GitHub APK.

on:
  push:
    branches:
      - "ccr-**"
      - "silo/**"

permissions:
  contents: read

# Any later push to the branch still cancels a build in progress: the gate and
# the build share one cancelling group. Publishing (the numbered release and
# the fixed-name links) runs in its own group that is never cancelled, so a
# push that lands mid-publish cannot leave a new release whose fixed links
# (the Fire TV Downloader codes) still serve the previous preview.
jobs:
  # Release markers count only in the commit's first line, so a message body
  # may mention them without starting a build.
  gate:
    runs-on: ubuntu-latest
    concurrency:
      group: silo-preview-apk-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      mode: ${{ steps.marker.outputs.mode }}
    steps:
      - id: marker
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          mode=none
          if [[ "$subject" == *"[release-apk]"* ]]; then mode=apk; fi
          if [[ "$mode" == none && "$subject" == *"[release-android-latest]"* ]]; then mode=latest; fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "Release marker: ${mode}"

  build-android:
    needs: gate
    # Only pushes build (and touch the cached signing key); never a pull_request.
    if: ${{ github.event_name == 'push' && needs.gate.outputs.mode == 'apk' }}
    runs-on: ubuntu-latest
    concurrency:
      group: silo-preview-apk-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      # Deletes this branch's plaintext keystore cache entry once an encrypted one exists.
      actions: write
    outputs:
      tag: ${{ steps.apks.outputs.tag }}
      version: ${{ steps.apks.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(bash scripts/silo_flutter_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: silo-preview-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # ffmpeg.org intermittently refuses runners; android/app/build.gradle.kts
      # keeps a checksum-verified copy of the FFmpeg source here.
      - name: Cache FFmpeg source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/plezilo-ffmpeg
          key: silo-preview-ffmpeg-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: silo-preview-ffmpeg-

      - name: Check for a keystore passphrase
        id: keystore-mode
        env:
          PASSPHRASE: ${{ secrets.PREVIEW_KEYSTORE_PASSPHRASE }}
        run: |
          if [[ -n "$PASSPHRASE" ]]; then echo "encrypted=true"; else echo "encrypted=false"; fi >> "$GITHUB_OUTPUT"

      # With a passphrase the cache holds only the encrypted keystore (key
      # silo-preview-keystore-enc-v1). The plaintext entry is the fallback so
      # a key cached before the secret existed keeps signing; "Save preview
      # keystore" then stores it, encrypted, under the new key, and the
      # plaintext entry is deleted. Restore and save are separate steps so
      # that only push runs of this workflow ever touch the key.
      - name: Restore preview keystore
        id: keystore-cache
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .preview-keystore
          key: ${{ steps.keystore-mode.outputs.encrypted == 'true' && 'silo-preview-keystore-enc-v1' || 'silo-preview-keystore-v1' }}
          restore-keys: |
            silo-preview-keystore-v1

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Configure Android signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSPHRASE: ${{ secrets.PREVIEW_KEYSTORE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" && -z "$PASSPHRASE" && "$GITHUB_EVENT_NAME" != push ]]; then
            echo "::error::Refusing to create or cache an unencrypted signing key outside a push run ($GITHUB_EVENT_NAME)."
            exit 1
          fi
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            store_password="$STORE_PASSWORD"; key_password="$KEY_PASSWORD"; key_alias="$KEY_ALIAS"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; signing with the cached preview keystore."
            cache=.preview-keystore
            work="$RUNNER_TEMP/preview-keystore"
            mkdir -p "$cache" "$work"
            if [[ -f "$cache/preview.jks" && -f "$cache/password" ]]; then
              # A plaintext key (cached without a passphrase): keep signing with it.
              cp "$cache/preview.jks" "$cache/password" "$work/"
            elif [[ -f "$cache/keystore.tar.enc" ]]; then
              [[ -n "$PASSPHRASE" ]] || { echo "::error::The cached preview keystore is encrypted but PREVIEW_KEYSTORE_PASSPHRASE is not set."; exit 1; }
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:PASSPHRASE \
                -in "$cache/keystore.tar.enc" | tar -x -C "$work" \
                || { echo "::error::Could not decrypt the cached preview keystore (wrong PREVIEW_KEYSTORE_PASSPHRASE?)."; exit 1; }
            else
              echo "::notice::No cached preview keystore; generating a new signing key. This preview will not install over earlier ones."
              openssl rand -hex 24 > "$work/password"
              keytool -genkeypair -noprompt -keystore "$work/preview.jks" -storetype JKS \
                -alias preview -keyalg RSA -keysize 4096 -validity 36500 \
                -storepass "$(cat "$work/password")" -keypass "$(cat "$work/password")" \
                -dname "CN=Plezilo preview"
            fi
            # Leave in the cache directory exactly what the cache post step should save.
            if [[ -n "$PASSPHRASE" ]]; then
              tar -c -C "$work" preview.jks password |
                openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -pass env:PASSPHRASE -out "$cache/keystore.tar.enc.new"
              mv "$cache/keystore.tar.enc.new" "$cache/keystore.tar.enc"
              rm -f "$cache/preview.jks" "$cache/password"
            else
              cp "$work/preview.jks" "$work/password" "$cache/"
              echo "::warning title=Signing key cached UNENCRYPTED::Any workflow run that can read this branch's Actions cache can copy the preview signing key and sign APKs that install over Plezilo. Add the PREVIEW_KEYSTORE_PASSPHRASE secret now (or the ANDROID_* secrets for a stable key). The key is also lost after 7 days without a build."
              {
                echo "## :warning: The Android signing key is cached unencrypted"
                echo
                echo "This build signed with the preview keystore kept in the Actions cache **in plain text** (\`silo-preview-keystore-v1\`)."
                echo "Any workflow run that can restore this branch's caches (for example a pull request into this branch) could copy it and sign an APK that installs over Plezilo."
                echo
                echo "**Fix (repository settings › Secrets and variables › Actions):**"
                echo "- Best: add \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_STORE_PASSWORD\`, \`ANDROID_KEY_PASSWORD\` and \`ANDROID_KEY_ALIAS\` (a stable key that never expires)."
                echo "- At least: add \`PREVIEW_KEYSTORE_PASSPHRASE\` (a long random string). The next build saves the key encrypted and deletes the plaintext cache entry."
                echo "- Also: Settings › Actions › General › require approval for all outside collaborators' workflow runs."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            cp "$work/preview.jks" android/app/upload-keystore.jks
            store_password="$(cat "$work/password")"; key_password="$store_password"; key_alias=preview
            rm -rf "$work"
            echo "cached=true" >> "$GITHUB_OUTPUT"
          fi
          cat > android/key.properties << EOF
          storePassword=$store_password
          keyPassword=$key_password
          keyAlias=$key_alias
          storeFile=upload-keystore.jks
          EOF

      # Saved right after signing is set up (also when the build later fails), so
      # a newly generated key is kept for the next preview.
      - name: Save preview keystore
        if: ${{ github.event_name == 'push' && steps.signing.outputs.cached == 'true' && steps.keystore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .preview-keystore
          key: ${{ steps.keystore-mode.outputs.encrypted == 'true' && 'silo-preview-keystore-enc-v1' || 'silo-preview-keystore-v1' }}

      # With the passphrase, the plaintext copy of this branch's key has no use
      # left once the encrypted entry exists: delete it.
      - name: Delete the plaintext keystore cache entry
        if: ${{ github.event_name == 'push' && steps.signing.outputs.cached == 'true' && steps.keystore-mode.outputs.encrypted == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          count() {
            local n
            n="$(gh api "repos/${GH_REPO}/actions/caches?key=$1&ref=${GITHUB_REF}" \
              --jq "[.actions_caches[] | select(.key == \"$1\")] | length" 2> /dev/null || true)"
            [[ "$n" =~ ^[0-9]+$ ]] && echo "$n" || echo 0
          }
          if [[ "$(count silo-preview-keystore-enc-v1)" == 0 ]]; then
            echo "::warning::No encrypted keystore cache entry found yet; the plaintext one (if any) is kept for now."
            exit 0
          fi
          if [[ "$(count silo-preview-keystore-v1)" != 0 ]]; then
            gh api -X DELETE "repos/${GH_REPO}/actions/caches?key=silo-preview-keystore-v1&ref=${GITHUB_REF}" > /dev/null \
              && echo "Deleted the plaintext keystore cache entry of ${GITHUB_REF}." \
              || echo "::warning::Could not delete the plaintext keystore cache entry (silo-preview-keystore-v1); delete it under Actions › Caches."
          fi

      # Each preview adds 0.1: <major>.<minor + 1>.0 of the highest existing
      # silo-preview-* tag (or pubspec's major.minor.0 when higher), with a build number
      # above every earlier preview's so it installs as an update even after
      # an upstream merge resets pubspec's version.
      - name: Pick preview version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pub="$(awk '/^version:/ && !found { print $2; found = 1 }' pubspec.yaml)"
          picked="$(bash scripts/silo_preview_version.sh next "$pub" "$GITHUB_SHA")"
          echo "$picked"
          if grep -qx 'reused=true' <<< "$picked"; then
            echo "::error::This commit already has a preview release; push a new commit to make another."
            exit 1
          fi
          echo "$picked" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.ver.outputs.version }}
          --build-number=${{ steps.ver.outputs.build }}
          --dart-define=GIT_COMMIT=${{ github.sha }}
          --dart-define=SENTRY_ENVIRONMENT=silo-preview

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Collect APKs
        id: apks
        run: |
          short_sha="${GITHUB_SHA::7}"
          version="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/plezilo-${version}-${short_sha}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          # GitHub orders releases by the version in the tag: newest first.
          echo "tag=${{ steps.ver.outputs.tag }}" >> "$GITHUB_OUTPUT"
          # The build number, read back by the next preview and the desktop builds.
          echo "build=${{ steps.ver.outputs.build }}" > dist/silo-preview-build.txt
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          # Plain-language notes from the change log's "## Next preview" section.
          python3 scripts/silo_release_notes.py docs/silo-preview-changelog.md "Next preview" release-notes.md \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      # Android installs a preview over the previous one only when both are
      # signed with the same certificate. When it changed (the cached key was
      # evicted, or the ANDROID_* secrets were added), the notes say so first.
      - name: Compare the signer with the previous preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          new_cert="$(python3 scripts/silo_apk_signer.py dist/*-arm64-v8a.apk)"
          echo "New APK signer SHA-256: ${new_cert}"
          prev="$(bash scripts/silo_preview_version.sh latest 2> /dev/null | sed -n 's/^tag=//p' || true)"
          if [[ -z "$prev" ]]; then
            echo "::notice::No earlier preview release to compare the signer with."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/prev-apk"
          if ! gh release download "$prev" --pattern '*-arm64-v8a.apk' --dir "$RUNNER_TEMP/prev-apk" 2> /dev/null; then
            echo "::warning::Could not download ${prev}'s arm64-v8a APK; the signer was not compared."
            exit 0
          fi
          old_cert="$(python3 scripts/silo_apk_signer.py "$RUNNER_TEMP"/prev-apk/*.apk || true)"
          rm -rf "$RUNNER_TEMP/prev-apk"
          echo "${prev} signer SHA-256: ${old_cert:-unknown}"
          if [[ -z "$old_cert" || "$old_cert" == "$new_cert" ]]; then
            echo "Signer unchanged since ${prev}: the preview installs as an update."
            echo "Signer unchanged since \`${prev}\` (\`${new_cert}\`)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=New signing key::This APK is signed with a different certificate than ${prev}; Android users must uninstall the previous preview first. The release notes say so."
          {
            echo "## :warning: New Android signing key"
            echo "This APK's signer (\`${new_cert}\`) differs from \`${prev}\`'s (\`${old_cert}\`)."
            echo "Android will not install it over the previous preview; the release notes start with an uninstall warning."
          } >> "$GITHUB_STEP_SUMMARY"
          version="${{ steps.ver.outputs.version }}"
          {
            echo "> **Android: uninstall the previous preview first.** Plezilo ${version} is signed with a new key, so Android won't install it over ${prev#silo-preview-} or earlier and says the app conflicts. Uninstalling removes your saved servers and downloads; sign in again afterwards. Windows and macOS install over the previous version as usual."
            echo
            cat release-notes.md
          } > release-notes.new && mv release-notes.new release-notes.md

      - name: Keep the APKs for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: silo-preview-apks
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 3

  # Not cancelled by later pushes (its own group, cancel-in-progress false):
  # the release and the fixed-name links are updated together or not at all.
  publish-android:
    needs: build-android
    runs-on: ubuntu-latest
    concurrency:
      group: silo-preview-apk-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch the APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: silo-preview-apks
          path: .

      # The tag must still be free: another build may have taken the number
      # since it was picked, and the release action would add to its release.
      - name: Check the tag is unused
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-android.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; not publishing over it."
            exit 1
          fi

      - name: Publish pre-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          draft: false
          prerelease: true
          name: Plezilo ${{ needs.build-android.outputs.version }} (Silo preview)
          tag_name: ${{ needs.build-android.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fixed-name copies for links that must not change (Fire TV Downloader codes):
      # releases/download/plezilo-android-latest/plezilo-<abi>.apk always serves this preview.
      - name: Refresh the latest Android links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/silo_android_latest.sh "${{ needs.build-android.outputs.tag }}"

  # "[release-android-latest]" in a commit's first line re-points the fixed-name links at the
  # newest numbered preview without building anything.
  refresh-latest:
    needs: gate
    if: ${{ needs.gate.outputs.mode == 'latest' }}
    runs-on: ubuntu-latest
    concurrency:
      group: silo-preview-apk-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Refresh the latest Android links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(bash scripts/silo_preview_version.sh latest | sed -n 's/^tag=//p')"
          [[ -n "$tag" ]] || { echo "::error::No numbered preview release found."; exit 1; }
          bash scripts/silo_android_latest.sh "$tag"
