name: Silo preview desktop
run-name: Silo preview desktop ${{ github.sha }}

# Builds the Windows app (x64 and arm64: installer and portable archives) and
# the macOS app (universal DMG) of a Silo-support branch and attaches them to
# a Silo preview release.
#
# Markers count only in the head commit's first line.
# - "[release-apk]" builds both from the same commit as the Android preview
#   and attaches to the release that build publishes (same version and build
#   number, from scripts/silo_preview_version.sh). If that build fails or is
#   cancelled, the desktop jobs stop instead of waiting for its release.
# - "[release-desktop]", "[release-windows]" or "[release-macos]" (without
#   "[release-apk]") builds both, Windows only or macOS only from the code of
#   the latest existing preview release and attaches to it.
#
# The update check is left off (no ENABLE_UPDATE_CHECK): it reads upstream
# Plezy's feed and would replace this build with Plezy without Silo. Both
# apps keep Plezy's app id, so they replace an installed Plezy. Neither is
# signed with a vendor certificate (SmartScreen / Gatekeeper warn once).
#
# Like upstream's GitHub builds: SUPPORTER_MODE=unlocked on macOS, msstore on
# Windows, and the Flutter SDK upstream's build.yml pins
# (scripts/silo_flutter_version.sh; Windows arm64 uses setup-flutter-git,
# which pins the same release).

on:
  push:
    branches:
      - "ccr-**"
      - "silo/**"

permissions:
  contents: read

concurrency:
  group: silo-preview-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release markers count only in the commit's first line, so a message body
  # may mention them without starting a build.
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.marker.outputs.mode }}
      windows: ${{ steps.marker.outputs.windows }}
      macos: ${{ steps.marker.outputs.macos }}
    steps:
      - id: marker
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          mode=none; windows=false; macos=false
          if [[ "$subject" == *"[release-apk]"* || "$subject" == *"[release-desktop]"* ]]; then
            windows=true; macos=true
          else
            [[ "$subject" == *"[release-windows]"* ]] && windows=true
            [[ "$subject" == *"[release-macos]"* ]] && macos=true
          fi
          if [[ "$subject" == *"[release-apk]"* ]]; then mode=apk
          elif [[ "$windows" == true || "$macos" == true ]]; then mode=latest; fi
          {
            echo "mode=${mode}"
            echo "windows=${windows}"
            echo "macos=${macos}"
          } >> "$GITHUB_OUTPUT"
          echo "Release marker: ${mode} (windows=${windows}, macos=${macos})"

  resolve:
    needs: gate
    if: ${{ needs.gate.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.pick.outputs.build }}
      flutter_version: ${{ steps.pick.outputs.flutter_version }}
    steps:
      # The scripts come from the pushed commit; the code built may be an
      # older release's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Pick release and code
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          set -euo pipefail
          # Decode the whole file before searching it: stopping early (grep -m1) can kill base64 with
          # SIGPIPE, which pipefail turns into a failed step.
          file_at() {
            gh api "repos/${GH_REPO}/contents/$1?ref=$2" --jq .content | base64 -d
          }
          if [[ "$MODE" == apk ]]; then
            # Same version and build as silo-preview-apk.yml picks for this
            # commit (or reads back, if its release is already out).
            ref="$GITHUB_SHA"
            pub="$(awk '/^version:/ && !found { print $2; found = 1 }' <<< "$(file_at pubspec.yaml "$ref")")"
            picked="$(bash scripts/silo_preview_version.sh next "$pub" "$ref")"
            version="$(sed -n 's/^version=//p' <<< "$picked")"
            build="$(sed -n 's/^build=//p' <<< "$picked")"
          else
            picked="$(bash scripts/silo_preview_version.sh latest)"
            tag="$(sed -n 's/^tag=//p' <<< "$picked")"
            version="$(sed -n 's/^version=//p' <<< "$picked")"
            build="$(sed -n 's/^build=//p' <<< "$picked")"
            ref="$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)"
          fi
          # One Flutter version for every job, from the code being built.
          work="$RUNNER_TEMP/pins"; mkdir -p "$work"
          file_at .github/workflows/build.yml "$ref" > "$work/build.yml"
          file_at .github/actions/setup-flutter-git/action.yml "$ref" > "$work/action.yml"
          flutter_version="$(bash scripts/silo_flutter_version.sh "$work/build.yml" "$work/action.yml")"
          {
            echo "ref=${ref}"
            echo "version=${version}"
            echo "build=${build}"
            echo "flutter_version=${flutter_version}"
          } >> "$GITHUB_OUTPUT"
          echo "Desktop build of ${ref} as ${version} (build ${build}, Flutter ${flutter_version})"

  build:
    needs: [gate, resolve]
    if: ${{ needs.gate.outputs.windows == 'true' }}
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            flutter_setup: action
            native_cache_path: build/windows/x64/_deps
          - arch: arm64
            runner: windows-11-arm
            flutter_setup: git
            native_cache_path: build/windows/arm64/_deps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Cache Windows native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ matrix.native_cache_path }}
          key: silo-preview-windows-native-${{ matrix.arch }}-${{ hashFiles('windows/CMakeLists.txt', 'mpv-build.lock.json') }}

      - name: Setup Flutter
        if: matrix.flutter_setup == 'action'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ needs.resolve.outputs.flutter_version }}
          cache: true

      - name: Set up Flutter from its pinned commit
        if: matrix.flutter_setup == 'git'
        uses: ./.github/actions/setup-flutter-git

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example

      - name: Install patched Flutter engine (DComp)
        shell: pwsh
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1

      - name: Build Windows ${{ matrix.arch }}
        shell: pwsh
        run: >
          flutter build windows --release
          --build-name=${{ needs.resolve.outputs.version }}
          --build-number=${{ needs.resolve.outputs.build }}
          --dart-define=GIT_COMMIT=${{ needs.resolve.outputs.ref }}
          --dart-define=SENTRY_ENVIRONMENT=silo-preview
          --dart-define=SUPPORTER_MODE=msstore

      - name: Verify Windows bundle contents
        shell: pwsh
        run: |
          $bundleDir = "build/windows/${{ matrix.arch }}/runner/Release"
          $bundlePath = (Resolve-Path -LiteralPath $bundleDir).Path
          $found = @(Get-ChildItem -LiteralPath $bundlePath -File -Recurse |
            ForEach-Object { $_.FullName.Substring($bundlePath.Length + 1).Replace('\', '/') })
          $required = @("plezy.exe", "flutter_windows.dll", "sqlite3.dll", "libmpv-2.dll", "data/app.so",
            "data/icudtl.dat", "data/flutter_assets/NativeAssetsManifest.json", "msvcp140.dll", "vcruntime140.dll",
            "data/flutter_assets/assets/brand/silo/silo-project-icon.png")
          $missing = @($required | Where-Object { $found -notcontains $_ })
          if ($missing.Count -gt 0) { throw "Windows bundle is missing: $($missing -join ', ')" }
          # As upstream's build.yml: link by-products and PDBs (release links
          # emit them, windows/CMakeLists.txt) must not ship in the bundle.
          $forbidden = @($found | Where-Object { $_ -in @("plezy.lib", "plezy.exp", "simdutf.lib") -or $_ -like '*.pdb' })
          if ($forbidden.Count -gt 0) { throw "Windows bundle contains build by-products: $($forbidden -join ', ')" }

      - name: Upload ${{ matrix.arch }} build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-${{ matrix.arch }}-build
          path: build/windows/${{ matrix.arch }}/runner/Release/

  package:
    needs: [gate, resolve, build]
    if: ${{ needs.gate.outputs.windows == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Download x64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-x64-build
          path: build-x64

      - name: Download arm64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-arm64-build
          path: build-arm64

      - name: Build installer and portables
        shell: pwsh
        run: .\windows\build-installer.ps1 -X64BuildDir "build-x64" -Arm64BuildDir "build-arm64" -Version "${{ needs.resolve.outputs.version }}"

      - name: Name and checksum the files
        shell: pwsh
        run: |
          $v = "${{ needs.resolve.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item plezy-windows-installer.exe "dist/plezy-silo-$v-windows-installer.exe"
          Move-Item plezy-windows-x64-portable.7z "dist/plezy-silo-$v-windows-x64-portable.7z"
          Move-Item plezy-windows-arm64-portable.7z "dist/plezy-silo-$v-windows-arm64-portable.7z"
          Push-Location dist
          Get-ChildItem -File | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii "SHA256SUMS-windows.txt"
          Pop-Location

      # A [release-apk] build attaches to the release the Android build
      # publishes; wait for it (that build usually finishes first).
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: silo-preview-${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build }}
          REF: ${{ needs.resolve.outputs.ref }}
          WHAT: Windows
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          set -euo pipefail
          # Wait for the release. In [release-apk] mode, stop as soon as the
          # APK run for this commit failed or was cancelled, and give up
          # shortly after it succeeded without publishing this tag.
          after_success=0
          for _ in $(seq 1 90); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            if [[ "$MODE" == apk ]]; then
              run="$(gh run list --workflow silo-preview-apk.yml --commit "$REF" --event push \
                --json databaseId,status,conclusion --jq 'sort_by(.databaseId) | last | "\(.status) \(.conclusion)"')"
              case "$run" in
                "completed success")
                  after_success=$((after_success + 1))
                  (( after_success <= 4 )) || { echo "::error::The APK build succeeded but no release $TAG appeared."; exit 1; } ;;
                completed\ *)
                  echo "::error::The APK build for this commit ended with '${run#completed }'; nothing to attach to."; exit 1 ;;
              esac
            fi
            echo "Waiting for release $TAG..."; sleep 30
          done
          gh release view "$TAG" > /dev/null
          # Attach only to the release of the commit and build built here.
          tag_ref="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
          [[ "$tag_ref" == "$REF" ]] || { echo "::error::$TAG is commit $tag_ref, but this build is $REF."; exit 1; }
          if recorded="$(gh release download "$TAG" --pattern silo-preview-build.txt --output - 2> /dev/null)"; then
            [[ "$recorded" == "build=${BUILD}" ]] || { echo "::error::$TAG records '$recorded', but this build is ${BUILD}."; exit 1; }
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "Attached $WHAT build to $TAG"

  macos:
    needs: [gate, resolve]
    if: ${{ needs.gate.outputs.macos == 'true' }}
    name: Build macOS
    runs-on: macos-26
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ needs.resolve.outputs.flutter_version }}
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: silo-preview-macos-pods-${{ hashFiles('**/Podfile.lock') }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build macOS
        run: >
          flutter build macos --release
          --build-name=${{ needs.resolve.outputs.version }}
          --build-number=${{ needs.resolve.outputs.build }}
          --dart-define=GIT_COMMIT=${{ needs.resolve.outputs.ref }}
          --dart-define=SENTRY_ENVIRONMENT=silo-preview
          --dart-define=SUPPORTER_MODE=unlocked

      # No Developer ID: sign the whole bundle ad hoc ("-") so every nested
      # framework carries a consistent signature, which Apple silicon requires
      # to run it at all. Gatekeeper still asks the user to allow it once.
      - name: Sign ad hoc and verify
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/Plezy.app"
          codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          exe="$app/Contents/MacOS/Plezy"
          lipo -archs "$exe"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [[ "$version" == "${{ needs.resolve.outputs.version }}" ]] || { echo "::error::App version is $version"; exit 1; }
          test -f "$app/Contents/Frameworks/App.framework/Resources/flutter_assets/assets/brand/silo/silo-project-icon.png"

      - name: Create DMG
        run: |
          set -euo pipefail
          v="${{ needs.resolve.outputs.version }}"
          mkdir -p dmg-staging dist
          cp -R build/macos/Build/Products/Release/Plezy.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -format ULMO -srcfolder dmg-staging -volname "Plezy" "dist/plezy-silo-${v}-macos.dmg"
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS-macos.txt)

      # A [release-apk] build attaches to the release the Android build
      # publishes; wait for it (that build usually finishes first).
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: silo-preview-${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build }}
          REF: ${{ needs.resolve.outputs.ref }}
          WHAT: macOS
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          set -euo pipefail
          # Wait for the release. In [release-apk] mode, stop as soon as the
          # APK run for this commit failed or was cancelled, and give up
          # shortly after it succeeded without publishing this tag.
          after_success=0
          for _ in $(seq 1 90); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            if [[ "$MODE" == apk ]]; then
              run="$(gh run list --workflow silo-preview-apk.yml --commit "$REF" --event push \
                --json databaseId,status,conclusion --jq 'sort_by(.databaseId) | last | "\(.status) \(.conclusion)"')"
              case "$run" in
                "completed success")
                  after_success=$((after_success + 1))
                  (( after_success <= 4 )) || { echo "::error::The APK build succeeded but no release $TAG appeared."; exit 1; } ;;
                completed\ *)
                  echo "::error::The APK build for this commit ended with '${run#completed }'; nothing to attach to."; exit 1 ;;
              esac
            fi
            echo "Waiting for release $TAG..."; sleep 30
          done
          gh release view "$TAG" > /dev/null
          # Attach only to the release of the commit and build built here.
          tag_ref="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
          [[ "$tag_ref" == "$REF" ]] || { echo "::error::$TAG is commit $tag_ref, but this build is $REF."; exit 1; }
          if recorded="$(gh release download "$TAG" --pattern silo-preview-build.txt --output - 2> /dev/null)"; then
            [[ "$recorded" == "build=${BUILD}" ]] || { echo "::error::$TAG records '$recorded', but this build is ${BUILD}."; exit 1; }
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "Attached $WHAT build to $TAG"
