name: Export preview signing key
run-name: Export preview signing key ${{ github.sha }}

# One-off backup of the Android preview signing key that silo-preview-apk.yml
# keeps in this branch's Actions cache, so the owner can store it as the
# ANDROID_* repository secrets (a stable key that never expires) and keep a copy.
#
# Runs only for a push whose head commit's FIRST line contains
# "[export-keystore]", and only when the PREVIEW_KEYSTORE_PASSPHRASE secret is
# set. The key never leaves the runner unencrypted: the artifact is
# preview-keystore.tar.enc (openssl aes-256-cbc, pbkdf2, 600000 iterations)
# holding preview.jks and its password file, encrypted with that passphrase.
# The artifact is kept for one day. Nothing is printed or logged about the key.
#
# Decrypt on your own computer (see docs/preview-signing-key.md):
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in preview-keystore.tar.enc | tar -x
on:
  push:
    branches:
      - "ccr-**"
      - "silo/**"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[export-keystore]') }}
    steps:
      - name: Check the marker and the passphrase
        id: check
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          PASSPHRASE: ${{ secrets.PREVIEW_KEYSTORE_PASSPHRASE }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          if [[ "$subject" != *"[export-keystore]"* ]]; then
            echo "The marker is not in the first line; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$PASSPHRASE" ]]; then
            echo "::error::Set the PREVIEW_KEYSTORE_PASSPHRASE repository secret first; the key is only ever exported encrypted."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      # The same cache entries silo-preview-apk.yml uses (branch-scoped).
      - name: Restore the encrypted keystore
        id: enc
        if: ${{ steps.check.outputs.run == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .preview-keystore
          key: silo-preview-keystore-enc-v1

      - name: Restore the plaintext keystore
        if: ${{ steps.check.outputs.run == 'true' && steps.enc.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .preview-keystore
          key: silo-preview-keystore-v1

      - name: Encrypt the keystore for download
        if: ${{ steps.check.outputs.run == 'true' }}
        env:
          PASSPHRASE: ${{ secrets.PREVIEW_KEYSTORE_PASSPHRASE }}
        run: |
          set -euo pipefail
          cache=.preview-keystore
          out="$RUNNER_TEMP/export"
          mkdir -p "$out"
          if [[ -f "$cache/keystore.tar.enc" ]]; then
            # Already encrypted with this passphrase: check it opens, then hand it over as is.
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:PASSPHRASE -in "$cache/keystore.tar.enc" \
              | tar -t > /dev/null \
              || { echo "::error::The cached keystore does not open with PREVIEW_KEYSTORE_PASSPHRASE."; exit 1; }
            cp "$cache/keystore.tar.enc" "$out/preview-keystore.tar.enc"
          elif [[ -f "$cache/preview.jks" && -f "$cache/password" ]]; then
            tar -c -C "$cache" preview.jks password \
              | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -pass env:PASSPHRASE -out "$out/preview-keystore.tar.enc"
          else
            echo "::error::No preview keystore in this branch's Actions cache (it expires after 7 days without a build)."
            exit 1
          fi
          rm -rf "$cache"
          sha256sum "$out/preview-keystore.tar.enc" | cut -d' ' -f1 > "$out/preview-keystore.tar.enc.sha256"
          {
            echo "## Preview signing key exported (encrypted)"
            echo
            echo "Download the **preview-signing-key** artifact below (kept for 1 day), then follow docs/preview-signing-key.md."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "out=$out" >> "$GITHUB_ENV"

      - name: Upload the encrypted keystore
        if: ${{ steps.check.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-signing-key
          path: ${{ env.out }}
          retention-days: 1
          if-no-files-found: error
