name: Silo release notes
run-name: Silo release notes ${{ github.sha }}

# Copies each "## silo-preview-…" section of docs/silo-preview-changelog.md
# onto the GitHub release with that tag, so release pages carry a plain-
# language change log. Runs when the change log (or this workflow) changes.

on:
  push:
    branches:
      - "ccr-**"
      - "silo/**"
    paths:
      - "docs/silo-preview-changelog.md"
      - "scripts/silo_release_notes.py"
      - ".github/workflows/silo-release-notes.yml"

permissions:
  contents: read

concurrency:
  group: silo-release-notes
  cancel-in-progress: false

jobs:
  update-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Previews are numbered by bumping the patch of pubspec's version: the
      # Nth preview of 2.22.0 is 2.22.N, tagged silo-preview-2.22.N so GitHub
      # lists the newest first. Releases still under an older tag scheme are
      # moved to their number (by creation order, the same count the preview
      # build uses). Old tags are left in place; built APKs are unchanged.
      - name: Number older previews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          name="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          major_minor="${name%.*}"; patch="${name##*.}"
          gh release list --limit 1000 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"silo-preview-${major_minor}.\"))] | sort_by(.createdAt) | .[].tagName" |
          { n=0; while read -r tag; do
            n=$((n + 1))
            version="${major_minor}.$((patch + n))"
            [[ "$tag" == "silo-preview-${version}" ]] && continue
            if [[ "$tag" =~ ^silo-preview-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::warning::$tag is numbered but expected silo-preview-${version}; left alone."
              continue
            fi
            gh release edit "$tag" --tag "silo-preview-${version}" --title "Plezy ${version} with Silo"
            echo "Moved release $tag to silo-preview-${version}"
          done; }

      - name: Update release pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tags=$(grep -oE '^## silo-preview-[A-Za-z0-9._-]+' docs/silo-preview-changelog.md | cut -c4-)
          for tag in $tags; do
            if ! gh release view "$tag" > /dev/null 2>&1; then
              echo "::notice::No release $tag yet; skipped."
              continue
            fi
            if python3 scripts/silo_release_notes.py docs/silo-preview-changelog.md "$tag" notes.md; then
              gh release edit "$tag" --notes-file notes.md
              echo "Updated $tag"
            else
              echo "::warning::Section $tag is empty; release left unchanged."
            fi
          done
