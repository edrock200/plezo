name: Silo release notes
run-name: Silo release notes ${{ github.sha }}

# Copies each "## silo-preview-…" section of docs/silo-preview-changelog.md
# onto the GitHub release with that tag, so release pages carry a plain-
# language change log. Runs when the change log (or this workflow) changes.
# Each page keeps its "Built from" line and anything the build put above the
# notes (the new-signing-key warning), and pages whose text would not change
# are left alone.

on:
  push:
    branches:
      - "ccr-**"
      - "silo/**"
    paths:
      - "docs/silo-preview-changelog.md"
      - "scripts/silo_release_notes.py"
      - ".github/workflows/silo-release-notes.yml"

permissions:
  contents: read

concurrency:
  group: silo-release-notes
  cancel-in-progress: false

jobs:
  update-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Previews are tagged silo-preview-<major>.<minor>.<patch> by
      # silo-preview-apk.yml (each preview adds 0.1 since 2.27.0; earlier ones
      # were <major>.<minor>.N). Releases are never renumbered here (that would
      # move tags under published APKs); only flag ones outside the scheme.
      - name: Check preview tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName \
            --jq '.[].tagName | select(startswith("silo-preview-") and (test("^silo-preview-[0-9]+\\.[0-9]+\\.[0-9]+$") | not))' |
          while read -r tag; do
            echo "::warning::Release $tag is not numbered silo-preview-<major>.<minor>.<patch>; later previews ignore it."
          done

      - name: Update release pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tags=$(grep -oE '^## silo-preview-[A-Za-z0-9._-]+' docs/silo-preview-changelog.md | cut -c4-)
          for tag in $tags; do
            if ! gh release view "$tag" > /dev/null 2>&1; then
              echo "::notice::No release $tag yet; skipped."
              continue
            fi
            gh release view "$tag" --json body --jq .body > current.md
            commit="$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha 2> /dev/null || true)"
            if python3 scripts/silo_release_notes.py docs/silo-preview-changelog.md "$tag" notes.md \
                --keep-from current.md ${commit:+"$commit"}; then
              # Compare without trailing whitespace: GitHub may normalise line ends.
              if [[ "$(sed 's/[[:space:]]*$//' notes.md)" == "$(sed 's/[[:space:]]*$//' current.md)" ]]; then
                echo "$tag unchanged"
                continue
              fi
              gh release edit "$tag" --notes-file notes.md
              echo "Updated $tag"
            else
              echo "::warning::Section $tag is empty; release left unchanged."
            fi
          done
